name: Generate artifact attestation

on:
  workflow_dispatch:
  push:
    branches: ["main", "master", "work"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create example build artifact
        run: |
          mkdir -p dist
          printf 'build-at=%s\ncommit=%s\n' "$(date -u +%FT%TZ)" "${GITHUB_SHA}" > dist/build-info.txt

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/build-info.txt

      - name: Normalize artifact digest for attestation
        id: digest
        run: |
          DIGEST="${{ steps.upload.outputs.artifact-digest }}"
          if [[ "$DIGEST" =~ ^sha256: ]]; then
            echo "value=$DIGEST" >> "$GITHUB_OUTPUT"
          else
            echo "value=sha256:$DIGEST" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate GitHub attestation
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: build-output
          subject-digest: ${{ steps.digest.outputs.value }}
          push-to-registry: false
